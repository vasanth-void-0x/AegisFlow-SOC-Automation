name: Auth runtime smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-auth-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Import production app
        env:
          DATABASE_URL: sqlite:///:memory:
          AUTH_ENABLED: "true"
          AUTH_SECRET: test-secret-that-is-more-than-thirty-two-characters
          AUTH_ADMIN_PASSWORD: test-admin-password
          AUTH_ANALYST_PASSWORD: test-analyst-password
          AUTH_VIEWER_PASSWORD: test-viewer-password
          AUTOMATION_API_KEY: test-automation-key
          SIEM_ENCRYPTION_KEY: test-siem-key
        run: python -c "from app.main import app; assert any(r.path == '/api/v1/auth/config' for r in app.routes); print('production import ok')"
      - name: Run auth tests
        run: pytest -q tests/test_auth.py
