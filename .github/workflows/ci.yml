name: BlueOrch CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        run: pytest tests/ --ignore=tests/test_mcp_server.py -v

  mcp-server-tests:
    name: MCP server tests (isolated venv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MCP server dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-mcp.txt
          pip install pytest==8.3.4 pytest-asyncio==0.24.0

      - name: Run MCP server tests
        working-directory: backend
        # MCP tests own their fixtures and dependency boundary. Loading the
        # backend-wide conftest imports FastAPI-only services into this job.
        run: pytest --noconftest tests/test_mcp_server.py -v -o asyncio_mode=auto

  frontend-build:
    name: Frontend build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  ai-evaluation:
    name: AI evaluation (regression check)
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluation
        working-directory: backend
        run: python ../evaluation/run_eval.py

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            evaluation/eval_report.md
            evaluation/eval_report.json

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high || true

  container-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t blueorch-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t blueorch-frontend:ci ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "blueorch-backend:ci"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "blueorch-frontend:ci"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
