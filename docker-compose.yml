version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/aegisflow.db
      - DEMO_MODE=${DEMO_MODE:-true}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=["http://localhost:5173","http://localhost:80"]
      - VECTOR_DB_PATH=/data/chroma_data
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # MCP server is optional - only needed if an MCP client (Claude Desktop,
  # n8n's MCP node, etc.) will connect to BlueOrch's security tools.
  mcp-server:
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp
    environment:
      - DATABASE_URL=sqlite:////data/aegisflow.db
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
    volumes:
      - backend-data:/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # MCP runs over stdio by default - in a container this service is meant
    # to be exec'd into or adapted to run over SSE/HTTP transport for remote
    # access. See docs/MCP_SETUP.md for connection instructions.
    stdin_open: true
    tty: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - WEBHOOK_URL=http://localhost:5678/
      - AEGISFLOW_API_BASE=http://backend:8000/api/v1
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/workflows:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-data:
  n8n-data:
